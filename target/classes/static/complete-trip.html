<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip in Progress | UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .map-placeholder {
            height: 300px;
            background: #E5E7EB;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .action-card {
            border-radius: 24px;
            border: 1px solid #E5E7EB;
            background: #FFF;
        }
        .status-badge {
            font-size: 0.8rem;
            letter-spacing: 1px;
            padding: 8px 16px;
        }
        .complete-btn {
            background: #10B981;
            border: none;
            color: white;
            transition: all 0.3s ease;
        }
        .complete-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="bg-light pt-5">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="vehicle-dashboard.html" class="btn btn-white shadow-sm border rounded-circle" style="width: 45px; height: 45px; line-height: 32px;"><i class="fa-solid fa-arrow-left text-dark"></i></a>
                    <div class="text-center">
                        <h4 class="fw-bold mb-0 text-dark">Trip In Progress</h4>
                        <small class="text-muted fw-bold" id="driverNameHeader">Driver Name</small>
                    </div>
                    <div class="badge bg-success rounded-pill status-badge" id="bookingStatus">IN PROGRESS</div>
                </div>

                <!-- Map View -->
                <div class="map-placeholder shadow-sm mb-4">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126743.58585966601!2d79.77380313175114!3d6.921838634863953!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ae253d10f7a7003%3A0x320b2e4d32d3838d!2sColombo%2C%20Sri%20Lanka!5e0!3m2!1sen!2sus!4v1714890283021!5m2!1sen!2sus" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>

                <!-- Ride Info Card -->
                <div class="action-card shadow-sm p-4 mb-4">
                    <div class="d-flex align-items-center mb-4">
                        <div class="rounded-circle bg-light border p-1 me-3" style="width: 60px; height: 60px;">
                            <img id="passengerAvatar" src="https://ui-avatars.com/api/?name=P&background=random" class="w-100 h-100 rounded-circle" alt="Passenger">
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0 text-dark" id="passengerName">Passenger <span class="text-primary">#P</span><span id="displayPassengerId">...</span></h5>
                            <div class="text-warning small"><i class="fa-solid fa-star"></i> 5.0 (Rating)</div>
                        </div>
                        <div class="ms-auto text-end">
                            <div class="fs-4 fw-bold text-success" id="rideFare">LKR 0</div>
                            <div class="text-muted small fw-bold" id="rideType">...</div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-10">

                    <!-- Route -->
                    <div class="mb-4">
                        <div class="d-flex mb-3">
                            <i class="fa-solid fa-circle text-primary mt-1 me-3 small"></i>
                            <div>
                                <label class="small text-muted fw-bold text-uppercase">Pickup</label>
                                <h6 class="fw-bold mb-0 text-dark" id="pickupLoc">Loading...</h6>
                            </div>
                        </div>
                        <div class="d-flex">
                            <i class="fa-solid fa-location-dot text-danger mt-1 me-3 fs-5"></i>
                            <div>
                                <label class="small text-muted fw-bold text-uppercase">Destination</label>
                                <h6 class="fw-bold mb-0 text-dark" id="dropoffLoc">Loading...</h6>
                            </div>
                        </div>
                    </div>

                <!-- Actions -->
                <div id="actionButtons" class="d-grid gap-3 pt-3">
                    <button class="btn btn-lg py-3 fw-bold shadow-sm complete-btn" id="mainActionBtn">COMPLETE TRIP</button>
                    <button class="btn btn-outline-danger w-100 py-3 fw-bold rounded-4" id="cancelRideBtn">Cancel Ride</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const bookingId = urlParams.get('id');

            if (!bookingId) {
                window.location.href = "vehicle-dashboard.html";
                return;
            }

            let currentBooking = null;

            function loadDetails() {
                $.get('/api/bookings/all', function(bookings) {
                    const b = bookings.find(x => x.bookingId == bookingId);
                    if (!b) return;
                    
                    currentBooking = b;

                    if (b.status === 'Completed' || b.status === 'Cancelled') {
                        window.location.href = "vehicle-dashboard.html";
                        return;
                    }

                    $('#bookingStatus').text(b.status.toUpperCase());
                    $('#displayPassengerId').text(String(b.passengerId).padStart(3, '0'));
                    $('#pickupLoc').text(b.pickupLocation);
                    $('#dropoffLoc').text(b.dropoffLocation);
                    $('#rideFare').text('LKR ' + b.fare.toLocaleString());
                    $('#rideType').text(b.rideType);

                    // Fetch Passenger Real Name
                    $.get(`/api/users/${b.passengerId}`, function(p) {
                        $('#passengerName').text(p.name);
                        $('#passengerAvatar').attr('src', `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=random`);
                    });

                    // Update Button Text based on status
                    if (b.status === 'Arrived') {
                        $('#mainActionBtn').text('START TRIP').removeClass('complete-btn').addClass('btn-primary');
                        $('#bookingStatus').removeClass('bg-success').addClass('bg-info');
                    } else {
                        $('#mainActionBtn').text('COMPLETE TRIP').addClass('complete-btn').removeClass('btn-primary');
                        $('#bookingStatus').addClass('bg-success').removeClass('bg-info');
                    }
                });
            }

            $('#driverNameHeader').text(localStorage.getItem('urbanride_userName') || 'Driver');
            loadDetails();
            setInterval(loadDetails, 1000);

            $('#mainActionBtn').click(function() {
                const currentStatus = $('#bookingStatus').text();
                if (currentStatus === 'ARRIVED') {
                    updateStatus('In Progress');
                } else {
                    updateStatus('Completed');
                }
            });

            function updateStatus(newStatus) {
                const btn = $('#mainActionBtn');
                btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> Updating...');

                $.ajax({
                    url: `/api/bookings/${bookingId}/status`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ status: newStatus }),
                    success: function(res) {
                        const s = res.status;
                        if (s === 'Completed') {
                            const finalFare = res.fare || (currentBooking ? currentBooking.fare : 0);
                            window.location.href = `waiting-payment.html?id=${bookingId}&fare=${finalFare}`;
                        } else {
                            // Immediately update UI to show COMPLETE TRIP if we just started
                            if (s === 'In Progress') {
                                $('#mainActionBtn').text('COMPLETE TRIP').addClass('complete-btn').removeClass('btn-primary').prop('disabled', false);
                                $('#bookingStatus').text('IN PROGRESS').addClass('bg-success').removeClass('bg-info');
                            }
                            loadDetails();
                            btn.prop('disabled', false);
                        }
                    },
                    error: function(xhr) {
                        btn.prop('disabled', false).html('TRY AGAIN');
                        alert("Update failed: " + (xhr.responseJSON?.error || "Unknown error"));
                    }
                });
            }

            $('#cancelRideBtn').click(function() {
                if(confirm("Are you sure you want to cancel this ride?")) {
                     $.ajax({
                        url: `/api/bookings/${bookingId}/status`,
                        type: 'PUT',
                        contentType: 'application/json',
                        data: JSON.stringify({ status: 'Cancelled' }),
                        success: function() {
                            window.location.href = "vehicle-dashboard.html";
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
