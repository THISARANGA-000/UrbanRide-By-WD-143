<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Feedbacks | UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #F3F4F6; }
        .feedback-card { transition: all 0.2s; background: #FFFFFF; border-radius: 15px; }
        .feedback-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .star-active { color: #F59E0B; }
        .star-inactive { color: #E5E7EB; }
        .delete-btn { color: #EF4444; cursor: pointer; transition: all 0.2s; }
        .delete-btn:hover { color: #B91C1C; transform: scale(1.1); }
        .edit-btn { color: #3B82F6; cursor: pointer; transition: all 0.2s; }
        .edit-btn:hover { color: #1D4ED8; transform: scale(1.1); }
        .star-rating i { cursor: pointer; font-size: 1.5rem; transition: color 0.2s; }
    </style>
</head>
<body class="pt-5">
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand urbanride-logo" href="profile.html">UrbanRide</a>
            <a href="profile.html" class="btn btn-outline-dark btn-sm rounded-pill px-3"><i class="fa-solid fa-arrow-left me-2"></i> Back to Profile</a>
        </div>
    </nav>

    <div class="container mt-5 pt-3">
        <div class="classic-card shadow-sm p-5 border">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="mb-1 fw-bold text-dark">My Feedbacks</h2>
                    <p class="text-muted mb-0">Manage the ratings and comments you've given to drivers.</p>
                </div>
            </div>

            <div class="row g-4" id="feedbackContainer">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted fw-bold">Loading your feedbacks...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Feedback Modal -->
    <div class="modal fade" id="editFeedbackModal" tabindex="-1" aria-labelledby="editFeedbackModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="editFeedbackModalLabel">Edit Feedback</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="editFeedbackId">
                    <div class="mb-4 text-center">
                        <label class="form-label d-block fw-bold text-muted mb-3">Your Rating</label>
                        <div class="star-rating" id="editStarRating">
                            <i class="fa-solid fa-star star-inactive" data-value="1"></i>
                            <i class="fa-solid fa-star star-inactive" data-value="2"></i>
                            <i class="fa-solid fa-star star-inactive" data-value="3"></i>
                            <i class="fa-solid fa-star star-inactive" data-value="4"></i>
                            <i class="fa-solid fa-star star-inactive" data-value="5"></i>
                        </div>
                        <input type="hidden" id="editRatingValue" value="0">
                    </div>
                    <div class="mb-3">
                        <label for="editComment" class="form-label fw-bold text-muted">Your Comment</label>
                        <textarea class="form-control rounded-3 border-2" id="editComment" rows="4" placeholder="How was your ride?"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" onclick="saveFeedbackUpdate()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            const userIdRaw = localStorage.getItem('urbanride_userId');
            const userId = userIdRaw ? String(userIdRaw).replace(/[^\d]/g, '') : null;
            if (!userId) { window.location.href = 'login.html'; return; }

            let allFeedbacks = [];

            function loadFeedbacks() {
                $.ajax({
                    url: `/api/feedbacks/passenger/${userId}`,
                    type: 'GET',
                    success: function(feedbacks) {
                        allFeedbacks = feedbacks;
                        const container = $('#feedbackContainer');
                        container.empty();

                        if (feedbacks.length === 0) {
                            container.html('<div class="col-12 text-center py-5"><i class="fa-solid fa-comment-slash fs-1 text-muted mb-3 d-block"></i><h4 class="text-muted fw-bold">No feedbacks found</h4><p class="text-muted">You haven\'t given any feedback to drivers yet.</p></div>');
                            return;
                        }

                        feedbacks.forEach(f => {
                            let dateStr = 'Unknown Date';
                            if (f.createdAt) {
                                try {
                                    if (Array.isArray(f.createdAt)) {
                                        dateStr = new Date(f.createdAt[0], f.createdAt[1] - 1, f.createdAt[2]).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
                                    } else {
                                        dateStr = new Date(f.createdAt).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
                                    }
                                } catch (e) { console.error("Date parse error", e); }
                            }
                            
                            let stars = '';
                            for (let i = 1; i <= 5; i++) {
                                stars += `<i class="fa-solid fa-star ${i <= f.rating ? 'star-active' : 'star-inactive'}"></i>`;
                            }

                            const card = `
                                <div class="col-md-6" id="feedback-${f.feedbackId}">
                                    <div class="feedback-card p-4 border shadow-sm h-100">
                                        <div class="d-flex justify-content-between align-items-start mb-3">
                                            <div>
                                                <h5 class="fw-bold mb-1 text-dark">${f.driverName || 'Driver'}</h5>
                                                <div class="mb-2">${stars} <span class="ms-2 fw-bold text-muted small">${f.rating.toFixed(1)}</span></div>
                                                <p class="text-muted small mb-0 fw-bold"><i class="fa-regular fa-calendar me-1"></i> ${dateStr}</p>
                                            </div>
                                            <div class="d-flex gap-2">
                                                <button class="btn btn-link edit-btn p-0" onclick="openEditModal(${f.feedbackId})">
                                                    <i class="fa-solid fa-pen-to-square fs-5"></i>
                                                </button>
                                                <button class="btn btn-link delete-btn p-0" onclick="deleteFeedback(${f.feedbackId})">
                                                    <i class="fa-solid fa-trash-can fs-5"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="bg-light p-3 rounded-3 border-0">
                                            <p class="mb-0 text-dark italic" id="comment-text-${f.feedbackId}">"${f.comment || 'No comment'}"</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                            container.append(card);
                        });
                    },
                    error: function(xhr) {
                        console.error("Feedback Load Error:", xhr);
                        const errorMsg = xhr.responseJSON?.error || xhr.responseText || "Unknown error";
                        $('#feedbackContainer').html(`<div class="col-12 text-center py-5"><div class="alert alert-danger rounded-4 border-0 shadow-sm">Failed to load feedbacks: ${errorMsg}</div></div>`);
                    }
                });
            }

            // Star Rating Logic in Modal
            $('#editStarRating i').on('click', function() {
                const val = $(this).data('value');
                $('#editRatingValue').val(val);
                updateModalStars(val);
            });

            function updateModalStars(rating) {
                $('#editStarRating i').each(function() {
                    const starVal = $(this).data('value');
                    if (starVal <= rating) {
                        $(this).removeClass('star-inactive').addClass('star-active');
                    } else {
                        $(this).removeClass('star-active').addClass('star-inactive');
                    }
                });
            }

            window.openEditModal = function(feedbackId) {
                const feedback = allFeedbacks.find(f => f.feedbackId === feedbackId);
                if (!feedback) return;

                $('#editFeedbackId').val(feedbackId);
                $('#editRatingValue').val(feedback.rating);
                $('#editComment').val(feedback.comment);
                updateModalStars(feedback.rating);

                const modal = new bootstrap.Modal(document.getElementById('editFeedbackModal'));
                modal.show();
            };

            window.saveFeedbackUpdate = function() {
                const feedbackId = $('#editFeedbackId').val();
                const rating = parseFloat($('#editRatingValue').val());
                const comment = $('#editComment').val();

                $.ajax({
                    url: `/api/feedbacks/${feedbackId}`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ rating, comment }),
                    success: function() {
                        bootstrap.Modal.getInstance(document.getElementById('editFeedbackModal')).hide();
                        loadFeedbacks(); // Reload to reflect changes
                    },
                    error: function() {
                        alert('Failed to update feedback.');
                    }
                });
            };

            window.deleteFeedback = function(feedbackId) {
                if (confirm('Are you sure you want to delete this feedback?')) {
                    $.ajax({
                        url: `/api/feedbacks/${feedbackId}`,
                        type: 'DELETE',
                        success: function() {
                            $(`#feedback-${feedbackId}`).fadeOut(300, function() {
                                $(this).remove();
                                if ($('#feedbackContainer').children().length === 0) {
                                    loadFeedbacks();
                                }
                            });
                        },
                        error: function() {
                            alert('Failed to delete feedback.');
                        }
                    });
                }
            };

            loadFeedbacks();
        });
    </script>
</body>
</html>
