<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | UrbanRide</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .split-screen { display: flex; min-height: 100vh; overflow: hidden; }
        .image-side { 
            flex: 1; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/taxi.png') center/cover no-repeat; 
            position: relative;
        }
        .form-side { 
            flex: 1.5; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background-color: #f3f4f6;
            overflow-y: auto;
        }
        .admin-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        @media (max-width: 992px) {
            .image-side { display: none; }
        }
    </style>
</head>
<body class="p-0 m-0">

    <div class="split-screen w-100">
        <div class="image-side d-none d-lg-block">
            <div class="position-absolute bottom-0 start-0 p-5 z-10 w-100">
                <h1 class="urbanride-logo mb-3 text-white" style="font-size: 3.5rem;">Admin Portal</h1>
                <p class="fs-4 text-white fw-light">Management & Operations Control</p>
            </div>
        </div>

        <div class="form-side p-4">
            <div class="admin-card animate__animated animate__fadeInRight">
                <div class="text-center mb-5">
                    <div class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-shield-halved fs-2"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Admin Sign In</h2>
                    <p class="text-muted">Enter credentials to access dashboard</p>
                </div>

                <div id="errorMsg" class="alert alert-danger d-none rounded-3 border-0 bg-danger bg-opacity-10 text-danger mb-4 animate__animated animate__shakeX"></div>

                <form id="adminLoginForm">
                    <div class="mb-4">
                        <label class="form-label">Admin Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-user-shield text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="adminEmail" placeholder="admin@urbanride.com" required>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label">Security Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="adminPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-3 mb-4 fw-bold shadow" id="loginBtn">
                        Authorize Access <i class="fa-solid fa-lock-open ms-2"></i>
                    </button>

                    <div class="text-center">
                        <a href="index.html" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage</a>
                        <span class="mx-2 text-muted">|</span>
                        <a href="admin-register.html" class="text-dark small fw-bold text-decoration-none">Create Admin Account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#adminLoginForm').on('submit', function(e) {
                e.preventDefault();
                const btn = $('#loginBtn');
                const error = $('#errorMsg');
                
                const payload = {
                    email: $('#adminEmail').val(),
                    password: $('#adminPassword').val()
                };

                btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin me-2"></i>Authorizing...');
                error.addClass('d-none');

                $.ajax({
                    url: '/api/admin/login',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    success: function(response) {
                        localStorage.setItem('urbanride_userId', response.adminId);
                        localStorage.setItem('urbanride_userName', response.name);
                        localStorage.setItem('urbanride_role', 'admin');
                        localStorage.setItem('urbanride_adminRole', response.adminRole || 'Administrator');
                        
                        btn.html('<i class="fa-solid fa-check me-2"></i>Access Granted').removeClass('btn-dark').addClass('btn-success');
                        setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 800);
                    },
                    error: function(xhr) {
                        btn.prop('disabled', false).html('Authorize Access <i class="fa-solid fa-lock-open ms-2"></i>');
                        const msg = xhr.responseJSON?.error || 'Authorization failed. Check credentials.';
                        error.text(msg).removeClass('d-none').addClass('animate__animated animate__shakeX');
                    }
                });
            });
        });
    </script>
</body>
</html>
