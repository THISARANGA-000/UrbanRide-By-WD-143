<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Application | UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .split-screen { display: flex; min-height: 100vh; }
        .image-side { 
            flex: 1; 
            background: url('images/taxi.png') center/cover no-repeat; 
            position: relative;
        }
        .form-side { 
            flex: 1.5; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 3rem;
            background-color: var(--light);
            overflow-y: auto;
        }
        .step-indicator { width: 2rem; height: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .step-active { background-color: var(--primary); color: var(--darker); }
        .step-inactive { background-color: #E5E7EB; color: #9CA3AF; }
        @media (max-width: 992px) {
            .image-side { display: none; }
            .form-side { background: url('images/taxi.png') center/cover no-repeat; position: relative; }
            .form-side::before { content: ''; position: absolute; inset: 0; background: rgba(2,6,23,0.9); backdrop-filter: blur(15px); }
            .glass-card { width: 100%; position: relative; z-index: 10; }
        }
    </style>
</head>
<body class="p-0 m-0">
    <div class="split-screen w-100">
        
        <!-- Image Side -->
        <div class="image-side d-none d-lg-block">
            <div class="position-absolute bottom-0 start-0 p-5 z-10 w-100" style="background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);">
                <h1 class="urbanride-logo mb-3 text-white" style="font-size: 3.5rem;">Drive with Us</h1>
                <p class="fs-4 text-white fw-light">Turn your miles into money.<br>Join the elite fleet today.</p>
            </div>
        </div>

        <!-- Form Side -->
        <div class="form-side">
            <div class="glass-card shadow-lg w-100 border-0" style="max-width: 700px;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="mb-0 fw-bold">Driver Application</h2>
                    <a href="index.html" class="urbanride-logo text-decoration-none fs-4">UrbanRide</a>
                </div>

                <!-- Stepper -->
                <div class="d-flex justify-content-between position-relative mb-5" style="max-width: 200px; margin: 0 auto;">
                    <div class="progress position-absolute top-50 start-0 w-100 translate-middle-y z-0" style="height: 4px;">
                        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                    </div>
                    <div class="step-indicator step-active z-1" id="step1-indicator">1</div>
                    <div class="step-indicator step-inactive z-1" id="step2-indicator">2</div>
                </div>

                <form id="driverForm">
                    <!-- Step 1: Personal Info -->
                    <div id="step1">
                        <h4 class="mb-4">Personal Information</h4>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="driverFullName" placeholder="Enter your full name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Mobile Number</label>
                                <input type="text" class="form-control" id="driverMobile" placeholder="Enter your mobile number" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="driverEmail" placeholder="Enter your email address" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">NIC Number</label>
                                <input type="text" class="form-control" id="driverNic" placeholder="Enter your NIC number" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="driverPassword" placeholder="Create a strong password" required>
                            </div>
                            <div class="col-12 mt-4 text-end">
                                <button type="button" class="btn btn-primary px-5 py-2 fw-bold" onclick="nextStep(2)">Next <i class="fa-solid fa-arrow-right ms-2"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Step 2: Vehicle Info -->
                    <div id="step2" class="d-none">
                        <h4 class="mb-4">Vehicle Information</h4>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">License Plate No.</label>
                                <input type="text" class="form-control" id="vehiclePlate" placeholder="Enter license plate number" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Vehicle Model</label>
                                <input type="text" class="form-control" id="vehicleModel" placeholder="e.g. Toyota Prius" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Manufacture Year</label>
                                <input type="number" class="form-control" id="vehicleYear" placeholder="e.g. 2018" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Vehicle Type</label>
                                <select class="form-select" id="vehicleType">
                                    <option value="Bike">Bike</option>
                                    <option value="Three-Wheel">Three-Wheel</option>
                                    <option value="Car" selected>Car</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Fuel Type</label>
                                <select class="form-select" id="fuelType">
                                    <option>Hybrid</option>
                                    <option>Electric</option>
                                    <option>Gasoline</option>
                                </select>
                            </div>
                            <div class="col-12 mt-4 d-flex justify-content-between">
                                <button type="button" class="btn btn-outline-dark px-4" onclick="nextStep(1)"><i class="fa-solid fa-arrow-left me-2"></i> Back</button>
                                <button type="submit" class="btn btn-success px-5 fw-bold">Submit Application <i class="fa-solid fa-check ms-2"></i></button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function nextStep(step) {
            $('#step1, #step2').addClass('d-none');
            $('#step' + step).removeClass('d-none');
            
            $('.step-indicator').removeClass('step-active').addClass('step-inactive');
            for(let i=1; i<=step; i++) {
                $('#step' + i + '-indicator').removeClass('step-inactive').addClass('step-active');
            }
            
            let progress = (step - 1) * 100;
            $('#progressBar').css('width', progress + '%');
        }

        $('#driverForm').submit(function(e) {
            e.preventDefault();
            const btn = $(this).find('button[type="submit"]');
            btn.html('<i class="fa-solid fa-spinner fa-spin"></i> Submitting...').prop('disabled', true);

            const payload = {
                name: $('#driverFullName').val(),
                mobile: $('#driverMobile').val(),
                email: $('#driverEmail').val(),
                nic: $('#driverNic').val(),
                password: $('#driverPassword').val(),
                vehiclePlate: $('#vehiclePlate').val(),
                vehicleModel: $('#vehicleModel').val(),
                vehicleYear: $('#vehicleYear').val(),
                vehicleType: $('#vehicleType').val(),
                fuelType: $('#fuelType').val()
            };

            $.ajax({
                url: '/api/drivers/register',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(payload),
                success: function(res) {
                    alert("Application submitted successfully!");
                    window.location.href = "login.html";
                },
                error: function(xhr) {
                    btn.html('Submit Application <i class="fa-solid fa-check ms-2"></i>').prop('disabled', false);
                    alert(xhr.responseJSON?.error || "Submission failed");
                }
            });
        });
    </script>
</body>
</html>
