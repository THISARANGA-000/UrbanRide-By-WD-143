<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard | UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #F3F4F6; }
        .blink-animation { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .booking-card { transition: all 0.3s ease; border-left: 5px solid #F59E0B; }
        .booking-card:hover { transform: translateX(5px); }
        .stat-card { background: white; border: 1px solid #E5E7EB; padding: 1.5rem; border-radius: 1rem; text-align: center; }
    </style>
</head>
<body class="pt-5">
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand urbanride-logo" href="#">UrbanRide Driver</a>
            <div class="form-check form-switch ms-auto me-3">
                <input class="form-check-input fs-4 shadow-none" type="checkbox" role="switch" id="onlineToggle" checked style="cursor: pointer;">
                <label class="form-check-label text-dark fw-bold ms-2 mt-1" id="onlineStatusText">ONLINE</label>
            </div>
            <span class="text-dark fw-bold me-3" id="driverNameNav">Driver: Loading...</span>
            <a href="login.html" onclick="localStorage.clear()" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</a>
        </div>
    </nav>

    <div class="container mt-5 pt-3">
        <!-- Dashboard Stats Row -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card shadow-sm">
                    <h6 class="text-muted text-uppercase small fw-bold mb-1">Total Earnings</h6>
                    <h3 class="text-success fw-bold mb-0" id="totalEarningsDisp">LKR 0</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card shadow-sm">
                    <h6 class="text-muted text-uppercase small fw-bold mb-1">Your Rating</h6>
                    <h3 class="text-warning fw-bold mb-0" id="driverRatingDisp"><i class="fa-solid fa-star me-1"></i> 0.0</h3>
                </div>
            </div>
            <div class="col-md-6">
                <div class="classic-card shadow-sm p-3 border h-100">
                    <div class="d-flex align-items-center">
                        <div class="rounded-circle bg-light me-3 overflow-hidden border border-primary" style="width: 50px; height: 50px; padding: 2px;">
                            <img src="" class="w-100 h-100 object-fit-cover rounded-circle" id="driverAvatar" alt="Driver">
                        </div>
                        <div class="flex-grow-1">
                            <h5 class="mb-0 fw-bold text-dark" id="profileName">Loading...</h5>
                            <div class="text-muted small" id="vehicleInfo">Loading vehicle...</div>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="driver-history.html" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
                            <button class="btn btn-sm btn-outline-dark" data-bs-toggle="modal" data-bs-target="#editDriverModal"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-outline-danger" id="deleteDriverBtn"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <!-- Booking Queue -->
            <div class="col-md-4">
                <div class="classic-card shadow-sm border p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-list-check me-2 text-primary"></i>Booking Queue</h4>
                        <span class="badge bg-primary text-dark" id="queueCount">0</span>
                    </div>
                    
                    <div id="bookingQueueContainer" style="max-height: 500px; overflow-y: auto;">
                        <div class="text-center py-5">
                            <i class="fa-solid fa-spinner fa-spin fs-2 text-muted mb-3"></i>
                            <p class="text-muted">Scanning for ride requests...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Active Map -->
            <div class="col-md-8">
                <div class="classic-card shadow-sm border p-0 overflow-hidden h-100 position-relative" style="min-height: 550px;">
                    <div class="position-absolute top-0 start-0 w-100 p-3 z-10 d-flex justify-content-between pointer-events-none">
                        <span class="badge bg-white text-dark fs-6 shadow-sm border"><i class="fa-solid fa-location-crosshairs text-primary me-2"></i>Live Tracking Map</span>
                    </div>
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126743.58585966601!2d79.77380313175114!3d6.921838634863953!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ae253d10f7a7003%3A0x320b2e4d32d3838d!2sColombo%2C%20Sri%20Lanka!5e0!3m2!1sen!2sus!4v1714890283021!5m2!1sen!2sus" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Driver Modal -->
    <div class="modal fade" id="editDriverModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Edit Profile</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="editDriverForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" class="form-control bg-light border-0 shadow-none" id="editName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Mobile Number</label>
                            <input type="text" class="form-control bg-light border-0 shadow-none" id="editMobile" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Vehicle Model</label>
                            <input type="text" class="form-control bg-light border-0 shadow-none" id="editVehicleModel" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Plate Number</label>
                            <input type="text" class="form-control bg-light border-0 shadow-none" id="editVehiclePlate" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mt-2" id="saveDriverBtn">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const driverId = localStorage.getItem('urbanride_userId');
        let driverVehicleType = "";

        $(document).ready(function() {
            if (!driverId) {
                window.location.href = 'login.html';
                return;
            }

            // Fetch driver details
            $.get(`/api/drivers/${driverId}`, function(d) {
                driverVehicleType = d.vehicleType;
                $('#driverNameNav').text('Driver: ' + d.name);
                $('#profileName').text(d.name);
                $('#vehicleInfo').text(`${d.vehicleModel} • ${d.vehiclePlate}`);
                $('#driverAvatar').attr('src', `https://ui-avatars.com/api/?name=${encodeURIComponent(d.name)}&background=F59E0B&color=fff`);
                
                // Set Stats
                $('#totalEarningsDisp').text('LKR ' + (d.totalEarnings || 0).toLocaleString());
                $('#driverRatingDisp').html(`<i class="fa-solid fa-star me-1 text-warning"></i> ${d.rating.toFixed(1)}`);

                // Pre-fill modal
                $('#editName').val(d.name);
                $('#editMobile').val(d.mobile);
                $('#editVehicleModel').val(d.vehicleModel);
                $('#editVehiclePlate').val(d.vehiclePlate);

                fetchBookings();
                setInterval(fetchBookings, 1000);
            }).fail(function() {
                console.error("Failed to fetch driver profile. Redirecting to login...");
                localStorage.clear();
                window.location.href = 'login.html';
            });

            function fetchBookings() {
                if (!$('#onlineToggle').is(':checked')) {
                    $('#bookingQueueContainer').html('<div class="text-center py-4"><i class="fa-solid fa-moon fs-2 text-muted mb-2"></i><p class="text-muted">You are currently OFFLINE</p></div>');
                    $('#queueCount').text('0');
                    return;
                }

                $.get('/api/bookings/pending', function(bookings) {
                    
                    const container = $('#bookingQueueContainer');
                    const filtered = bookings.filter(b => {
                        return b.rideType && driverVehicleType && 
                               b.rideType.toLowerCase() === driverVehicleType.toLowerCase();
                    });
                    
                    $('#queueCount').text(filtered.length);
                    container.empty();

                    if (filtered.length === 0) {
                        container.html('<div class="text-center py-4"><p class="text-muted">No ride requests matching your vehicle type.</p></div>');
                        return;
                    }

                    filtered.forEach(b => {
                        container.append(`
                            <div class="booking-card bg-light p-3 rounded-4 mb-3 border shadow-sm">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="badge bg-dark text-white">#B${String(b.bookingId).padStart(3, '0')}</span>
                                    <span class="fw-bold text-success">LKR ${b.fare}</span>
                                </div>
                                <div class="small mb-3">
                                    <div class="text-muted text-uppercase fw-bold" style="font-size: 10px;">Pickup</div>
                                    <div class="fw-bold text-dark mb-2">${b.pickupLocation}</div>
                                    <div class="text-muted text-uppercase fw-bold" style="font-size: 10px;">Destination</div>
                                    <div class="fw-bold text-dark">${b.dropoffLocation}</div>
                                </div>
                                <button class="btn btn-primary w-100 btn-sm fw-bold shadow-sm" onclick="acceptRide(${b.bookingId})">
                                    ACCEPT REQUEST
                                </button>
                            </div>
                        `);
                    });
                });
            }

            window.acceptRide = function(id) {
                if(!confirm("Accept this ride request?")) return;
                $.ajax({
                    url: `/api/bookings/${id}/status`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ status: 'Accepted', driverId: driverId }),
                    success: function() {
                        window.location.href = `accept.html?id=${id}`;
                    },
                    error: function(xhr) {
                        const msg = xhr.responseJSON?.error || "Failed to accept ride.";
                        alert(msg);
                        fetchBookings();
                    }
                });
            };

            // Update Profile
            $('#editDriverForm').submit(function(e) {
                e.preventDefault();
                const btn = $('#saveDriverBtn');
                btn.html('<i class="fa-solid fa-spinner fa-spin me-2"></i>Saving...').prop('disabled', true);
                const payload = {
                    name: $('#editName').val().trim(),
                    mobile: $('#editMobile').val().trim(),
                    vehicleModel: $('#editVehicleModel').val().trim(),
                    vehiclePlate: $('#editVehiclePlate').val().trim()
                };
                $.ajax({
                    url: `/api/drivers/${driverId}`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    success: function(res) {
                        localStorage.setItem('urbanride_userName', payload.name);
                        location.reload();
                    },
                    error: function() {
                        btn.html('Save Changes').prop('disabled', false);
                        alert("Update failed");
                    }
                });
            });

            // Delete Profile
            $('#deleteDriverBtn').click(function() {
                if(confirm("Are you sure you want to permanently delete your driver account?")) {
                    $.ajax({
                        url: `/api/drivers/${driverId}`, type: 'DELETE',
                        success: function() {
                            alert("Account deleted successfully."); localStorage.clear(); window.location.href = "index.html";
                        }
                    });
                }
            });

            $('#onlineToggle').change(function() {
                const isOnline = this.checked;
                $.ajax({
                    url: `/api/drivers/${driverId}/status`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({ status: isOnline ? 'online' : 'offline' }),
                    success: function() {
                        if(isOnline) $('#onlineStatusText').text('ONLINE').removeClass('text-danger').addClass('text-success');
                        else $('#onlineStatusText').text('OFFLINE').removeClass('text-success').addClass('text-danger');
                        fetchBookings();
                    }
                });
            });
        });
    </script>
</body>
</html>
