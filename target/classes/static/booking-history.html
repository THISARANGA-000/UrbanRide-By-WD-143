<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History | UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #F3F4F6; }
        .history-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); background: #FFFFFF; }
        .history-card:hover { transform: translateY(-5px); border-color: var(--primary) !important; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="pt-5">
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand urbanride-logo" href="profile.html">UrbanRide</a>
            <a href="profile.html" class="btn btn-outline-dark btn-sm rounded-pill px-3"><i class="fa-solid fa-arrow-left me-2"></i> Back to Profile</a>
        </div>
    </nav>

    <div class="container mt-5 pt-3">
        <div class="classic-card shadow-sm p-5 border">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="mb-1 fw-bold text-dark">My Booking History</h2>
                    <p class="text-muted mb-0">Review all your personal journeys and receipts.</p>
                </div>
            </div>

            <div class="row g-4" id="historyContainer">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted fw-bold">Loading your ride history...</p>
                </div>
            </div>
            
            <nav class="mt-5 d-flex justify-content-center">
                <ul class="pagination pagination-md shadow-sm">
                    <li class="page-item disabled"><a class="page-link bg-light text-muted border fw-bold" href="#">Previous</a></li>
                    <li class="page-item active"><a class="page-link bg-primary border-primary text-dark fw-bold" href="#">1</a></li>
                    <li class="page-item"><a class="page-link bg-white text-dark border fw-bold" href="#">2</a></li>
                    <li class="page-item"><a class="page-link bg-white text-dark border fw-bold" href="#">Next</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            const userId = localStorage.getItem('urbanride_userId');
            if (!userId) { window.location.href = 'login.html'; return; }

            $.ajax({
                url: `/api/bookings/passenger/${userId}`,
                type: 'GET',
                success: function(bookings) {
                    const container = $('#historyContainer');
                    container.empty();

                    if (bookings.length === 0) {
                        container.html('<div class="col-12 text-center py-5"><i class="fa-solid fa-route fs-1 text-muted mb-3 d-block"></i><h4 class="text-muted fw-bold">No rides found yet</h4><p class="text-muted">Your journey history will appear here once you complete a ride.</p><a href="book-ride.html" class="btn btn-primary px-4 mt-2">Book Your First Ride</a></div>');
                        return;
                    }

                    bookings.forEach(booking => {
                        const statusClass = booking.status === 'Completed' ? 'bg-success text-success' : 
                                           (booking.status === 'Cancelled' ? 'bg-danger text-danger' : 'bg-warning text-warning');
                        const statusIcon = booking.status === 'Completed' ? 'fa-check' : 
                                          (booking.status === 'Cancelled' ? 'fa-xmark' : 'fa-clock');
                        
                        const date = new Date(booking.createdAt).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
                        const time = new Date(booking.createdAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                        const card = `
                            <div class="col-md-6">
                                <div class="classic-card history-card p-4 border shadow-sm h-100 d-flex flex-column">
                                    <div class="d-flex justify-content-between align-items-start mb-4">
                                        <div>
                                            <span class="badge ${statusClass} mb-3 px-3 py-2 fw-bold text-uppercase" style="letter-spacing:0.5px;">
                                                <i class="fa-solid ${statusIcon} me-1"></i> ${booking.status}
                                            </span>
                                            <h4 class="mb-1 fw-bold text-dark">${booking.pickupLocation} <i class="fa-solid fa-arrow-right mx-2 text-muted fs-6"></i> ${booking.dropoffLocation}</h4>
                                            <p class="text-muted small mb-0 fw-bold"><i class="fa-regular fa-calendar me-1"></i> ${date} • ${time} • ID: #B${String(booking.bookingId).padStart(3, '0')}</p>
                                        </div>
                                        <div class="text-end">
                                            <h3 class="mb-1 ${booking.status === 'Cancelled' ? 'text-muted' : 'text-success'} fw-bold">LKR ${booking.fare.toLocaleString()}</h3>
                                            <p class="text-muted small mb-0 fw-bold"><i class="fa-solid fa-car me-1"></i> ${booking.rideType}</p>
                                        </div>
                                    </div>
                                    
                                    <div class="row g-2 mb-4 bg-light p-3 rounded-3 border-0">
                                        <div class="col-6">
                                            <div class="text-muted small text-uppercase fw-bold" style="font-size: 10px;">Driver</div>
                                            <div class="text-dark fw-bold small"><i class="fa-solid fa-id-badge me-1 text-primary"></i> ${booking.driverName || 'N/A'}</div>
                                        </div>
                                        <div class="col-6">
                                            <div class="text-muted small text-uppercase fw-bold" style="font-size: 10px;">Payment Method</div>
                                            <div class="text-dark fw-bold small"><i class="fa-solid fa-wallet me-1 text-primary"></i> ${booking.paymentMethod || 'N/A'}</div>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-end align-items-center mt-auto pt-3 border-top">
                                         <button class="btn btn-outline-primary btn-sm rounded-pill px-4 fw-bold" onclick="window.location.href='book-ride.html'">Re-book <i class="fa-solid fa-rotate-right ms-1"></i></button>
                                     </div>
                                </div>
                            </div>
                        `;
                        container.append(card);
                    });
                },
                error: function() {
                    $('#historyContainer').html('<div class="col-12 text-center py-5"><div class="alert alert-danger rounded-4 border-0 shadow-sm">Failed to load history. Please try again.</div></div>');
                }
            });
        });
    </script>
</body>
</html>
