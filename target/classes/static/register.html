<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | UrbanRide</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚖</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .split-screen { display: flex; min-height: 100vh; overflow: hidden; }
        .image-side { 
            flex: 1; 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('images/luxury.png') center/cover no-repeat; 
            position: relative;
        }
        .form-side { 
            flex: 1.5; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 3rem;
            background-color: var(--light);
            overflow-y: auto;
        }
        @media (max-width: 992px) {
            .image-side { display: none; }
            .form-side { background: var(--light); }
            .glass-card { width: 100%; border: none; box-shadow: none; background: transparent; }
        }
    </style>
</head>
<body class="p-0 m-0">

    <div class="split-screen w-100">
        <!-- Image Side -->
        <div class="image-side d-none d-lg-block">
            <div class="position-absolute bottom-0 start-0 p-5 z-10 w-100" style="background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);">
                <h1 class="urbanride-logo mb-3 text-white" style="font-size: 3.5rem;">Join UrbanRide</h1>
                <p class="fs-4 text-white fw-light">Premium rides, affordably.<br>Start your journey.</p>
            </div>
        </div>

        <!-- Form Side -->
        <div class="form-side">
            <div class="glass-card w-100 border-0" style="max-width: 550px;">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div>
                        <h2 class="fw-bold mb-1">Create Account</h2>
                        <p class="text-muted mb-0">Sign up as a passenger</p>
                    </div>
                    <a href="index.html" class="urbanride-logo text-decoration-none fs-4">UR</a>
                </div>

                <div class="error-container mb-3" style="min-height: 50px;">
                    <div id="errorMsg" class="alert alert-danger d-none rounded-3 border-0 bg-danger bg-opacity-10 text-danger animate__animated animate__shakeX" role="alert"></div>
                </div>

                <form id="registerForm">
                    <div class="mb-4">
                        <label class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="name" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="Enter your email address" required autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-phone text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="mobile" placeholder="Enter your mobile number" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group mb-2">
                            <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="Create a strong password" required>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-check-double text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="confirmPassword" placeholder="Re-enter your password" required>
                        </div>
                    </div>
                    
                    <div class="form-check mb-4">
                        <input class="form-check-input shadow-none" type="checkbox" value="" id="flexCheckDefault" required>
                        <label class="form-check-label text-muted small" for="flexCheckDefault">
                            I agree to the <a href="#" class="text-dark fw-bold">Terms of Service</a> and <a href="#" class="text-dark fw-bold">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 mb-4 shadow-sm" id="registerBtn">Create Account <i class="fa-solid fa-arrow-right ms-2"></i></button>

                    <div class="text-center text-muted">
                        Already have an account? <a href="login.html" class="text-dark fw-bold text-decoration-none border-bottom border-dark pb-1">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
