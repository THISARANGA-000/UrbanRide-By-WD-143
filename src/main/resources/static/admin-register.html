<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | UrbanRide</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .split-screen { display: flex; min-height: 100vh; overflow: hidden; }
        .image-side { 
            flex: 1; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('images/taxi.png') center/cover no-repeat; 
            position: relative;
        }
        .form-side { 
            flex: 1.5; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background-color: #f3f4f6;
            overflow-y: auto;
        }
        .admin-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
        }
        @media (max-width: 992px) {
            .image-side { display: none; }
        }
    </style>
</head>
<body class="p-0 m-0">

    <div class="split-screen w-100">
        <div class="image-side d-none d-lg-block">
            <div class="position-absolute bottom-0 start-0 p-5 z-10 w-100">
                <h1 class="urbanride-logo mb-3 text-white" style="font-size: 3.5rem;">Join the Team</h1>
                <p class="fs-4 text-white fw-light">Create a new administrator account</p>
            </div>
        </div>

        <div class="form-side p-4">
            <div class="admin-card animate__animated animate__fadeInRight">
                <div class="text-center mb-5">
                    <h2 class="fw-bold mb-1">New Administrator</h2>
                    <p class="text-muted">Register for system access</p>
                </div>

                <div id="errorMsg" class="alert alert-danger d-none rounded-3 border-0 bg-danger bg-opacity-10 text-danger mb-4 animate__animated animate__shakeX"></div>

                <form id="adminRegisterForm">
                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="john@urbanride.com" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mobile No</label>
                            <input type="text" class="form-control" id="mobile" placeholder="+94 77..." required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Admin Role</label>
                            <select class="form-select" id="adminRole">
                                <option value="Manager">Manager</option>
                                <option value="Support">Support</option>
                                <option value="Analyst">Analyst</option>
                            </select>
                        </div>
                        <div class="col-12 mb-4">
                            <label class="form-label">System Password</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-3 mb-4 fw-bold shadow" id="registerBtn">
                        Register Account <i class="fa-solid fa-user-plus ms-2"></i>
                    </button>

                    <div class="text-center">
                        <span class="text-muted small">Already have access?</span>
                        <a href="admin-login.html" class="text-dark small fw-bold text-decoration-none ms-1">Sign In here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#adminRegisterForm').on('submit', function(e) {
                e.preventDefault();
                const btn = $('#registerBtn');
                const error = $('#errorMsg');
                
                const payload = {
                    name: $('#name').val(),
                    email: $('#email').val(),
                    mobile: $('#mobile').val(),
                    adminRole: $('#adminRole').val(),
                    password: $('#password').val()
                };

                btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin me-2"></i>Creating...');
                error.addClass('d-none');

                $.ajax({
                    url: '/api/admin/register',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    success: function(response) {
                        btn.html('<i class="fa-solid fa-check me-2"></i>Account Created').removeClass('btn-dark').addClass('btn-success');
                        setTimeout(() => { window.location.href = 'admin-login.html'; }, 800);
                    },
                    error: function(xhr) {
                        btn.prop('disabled', false).html('Register Account <i class="fa-solid fa-user-plus ms-2"></i>');
                        const msg = xhr.responseJSON?.error || 'Registration failed. Please try again.';
                        error.text(msg).removeClass('d-none').addClass('animate__animated animate__shakeX');
                    }
                });
            });
        });
    </script>
</body>
</html>
