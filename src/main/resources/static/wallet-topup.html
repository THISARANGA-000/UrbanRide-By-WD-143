<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Top-Up | UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: #F3F4F6; }
        .amount-btn { border: 2px solid #E5E7EB; background: transparent; color: #4B5563; transition: 0.2s; font-weight: 700; }
        .amount-btn:hover { background: #F9FAFB; transform: translateY(-2px); border-color: var(--primary); }
        .btn-check:checked + .amount-btn { background: #FEF3C7; border-color: var(--primary); color: #D97706; }
    </style>
</head>
<body class="pt-5">
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand urbanride-logo" href="profile.html">UrbanRide</a>
            <a href="profile.html" class="btn btn-outline-dark btn-sm rounded-pill px-3"><i class="fa-solid fa-arrow-left me-2"></i> Back to Profile</a>
        </div>
    </nav>

    <div class="container mt-5 pt-3">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="classic-card shadow-sm p-5 border text-center mb-4" style="background: linear-gradient(135deg, var(--white), #FEF3C7);">
                    <i class="fa-solid fa-wallet text-primary" style="font-size: 4rem; opacity: 0.9;"></i>
                    <h5 class="text-muted text-uppercase fw-bold mt-4 mb-2">Available Balance</h5>
                    <h1 class="display-4 fw-bold text-dark mb-0">LKR <span id="walletBalance">2,500</span>.00</h1>
                </div>

                <div class="classic-card shadow-sm p-4 border">
                    <h4 class="mb-4 fw-bold text-dark border-bottom pb-3">Top Up Wallet</h4>
                    
                    <p class="text-muted fw-bold mb-2">Select Amount</p>
                    <div class="row g-3 mb-4">
                        <div class="col-4">
                            <input type="radio" class="btn-check amount-radio" name="amounts" id="amt1" value="500">
                            <label class="btn amount-btn w-100 py-3 rounded-3" for="amt1">+500</label>
                        </div>
                        <div class="col-4">
                            <input type="radio" class="btn-check amount-radio" name="amounts" id="amt2" value="1000">
                            <label class="btn amount-btn w-100 py-3 rounded-3" for="amt2">+1,000</label>
                        </div>
                        <div class="col-4">
                            <input type="radio" class="btn-check amount-radio" name="amounts" id="amt3" value="2000">
                            <label class="btn amount-btn w-100 py-3 rounded-3" for="amt3">+2,000</label>
                        </div>
                        <div class="col-4">
                            <input type="radio" class="btn-check amount-radio" name="amounts" id="amt4" value="5000">
                            <label class="btn amount-btn w-100 py-3 rounded-3" for="amt4">+5,000</label>
                        </div>
                        <div class="col-8">
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted fw-bold border-secondary">LKR</span>
                                <input type="number" class="form-control text-dark fw-bold border-secondary" id="customAmount" placeholder="Custom Amount">
                            </div>
                        </div>
                    </div>

                    <p class="text-muted fw-bold mb-3">Payment Method</p>
                    <div class="list-group mb-4" id="paymentMethodsList">
                        <label class="list-group-item d-flex align-items-center p-3 border rounded-3 mb-2 cursor-pointer shadow-sm">
                            <input class="form-check-input me-3" type="radio" name="payMethod" value="default" checked>
                            <i class="fa-brands fa-cc-visa text-primary fs-3 me-3"></i>
                            <div>
                                <span class="fw-bold d-block text-dark">Visa ending in 4242</span>
                                <small class="text-muted">Expires 12/28</small>
                            </div>
                        </label>
                    </div>
                    <button type="button" id="addNewCardBtn" class="btn btn-light w-100 p-3 text-primary fw-bold border border-dashed rounded-3 mb-4">
                        <i class="fa-solid fa-plus me-3"></i> Add new card
                    </button>

                    <div id="newCardForm" class="p-3 border rounded-3 bg-light mb-4 shadow-sm" style="display: none;">
                        <h6 class="mb-3 fw-bold text-dark"><i class="fa-solid fa-lock me-2 text-muted"></i>Secure Card Entry</h6>
                        <div class="mb-2">
                            <input type="text" class="form-control border-secondary text-dark fw-bold mb-2" id="newCardNum" placeholder="0000 0000 0000 0000">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <input type="text" class="form-control border-secondary text-dark fw-bold" id="newCardExp" placeholder="MM/YY">
                            </div>
                            <div class="col-6">
                                <input type="text" class="form-control border-secondary text-dark fw-bold" placeholder="CVC">
                            </div>
                        </div>
                        <button type="button" class="btn btn-dark w-100 fw-bold shadow-sm" id="saveCardBtn">Save Securely</button>
                    </div>

                    <button class="btn btn-primary btn-lg w-100 py-3 fw-bold text-dark shadow-sm" id="processTopup">
                        Process Top-Up <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            const userId = localStorage.getItem('urbanride_userId');
            if (!userId) { window.location.href = 'login.html'; return; }

            let currentBalance = 0;

            // Fetch real balance and saved cards
            $.get(`/api/users/${userId}`, function(user) {
                currentBalance = user.walletBalance || 0;
                $('#walletBalance').text(currentBalance.toLocaleString());
                
                if (user.savedCardLast4) {
                    const savedCardHtml = `
                        <label class="list-group-item d-flex align-items-center p-3 border rounded-3 mb-2 cursor-pointer shadow-sm">
                            <input class="form-check-input me-3" type="radio" name="payMethod" value="saved" checked>
                            <i class="fa-brands fa-cc-visa text-primary fs-3 me-3"></i>
                            <div>
                                <span class="fw-bold d-block text-dark">Visa ending in ${user.savedCardLast4} (Saved)</span>
                                <small class="text-muted">Expires ${user.savedCardExpiry}</small>
                            </div>
                        </label>
                    `;
                    $('#paymentMethodsList').html(savedCardHtml);
                }
            });

            $('.amount-radio').change(function() {
                $('#customAmount').val('');
            });

            $('#customAmount').on('input', function() {
                $('.amount-radio').prop('checked', false);
            });

            $('#addNewCardBtn').click(function() {
                $('#newCardForm').slideToggle();
            });

            $('#saveCardBtn').click(function() {
                const cardNum = $('#newCardNum').val();
                const exp = $('#newCardExp').val();
                if (cardNum.length < 12) { alert("Invalid card number"); return; }
                
                const last4 = cardNum.slice(-4);
                const newCardHtml = `
                    <label class="list-group-item d-flex align-items-center p-3 border rounded-3 mb-2 cursor-pointer shadow-sm animate__animated animate__fadeInDown">
                        <input class="form-check-input me-3" type="radio" name="payMethod" value="new" checked>
                        <i class="fa-solid fa-credit-card text-dark fs-3 me-3"></i>
                        <div>
                            <span class="fw-bold d-block text-dark">New Card ending in ${last4}</span>
                            <small class="text-muted">Expires ${exp}</small>
                        </div>
                    </label>
                `;
                $('#paymentMethodsList').append(newCardHtml);
                $('#newCardForm').slideUp();
            });

            $('#processTopup').click(function() {
                let amount = $('#customAmount').val();
                if(!amount) amount = $('input[name="amounts"]:checked').val();
                
                if(!amount || amount <= 0) {
                    alert("Please select or enter a valid amount.");
                    return;
                }

                const payMethod = $('input[name="payMethod"]:checked').val();
                const payload = { amount: parseFloat(amount) };
                
                // If using a new card that was just "saved" in UI
                if (payMethod === 'new') {
                    payload.cardNumber = $('#newCardNum').val();
                    payload.cardExpiry = $('#newCardExp').val();
                }

                const btn = $(this);
                btn.html('<i class="fa-solid fa-spinner fa-spin me-2"></i>Processing...').prop('disabled', true);
                
                $.ajax({
                    url: `/api/users/${userId}/wallet`,
                    type: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify(payload),
                    success: function(response) {
                        $('#walletBalance').text(response.newBalance.toLocaleString());
                        btn.html('<i class="fa-solid fa-check me-2"></i>Top-Up Successful!').addClass('btn-success');
                        
                        setTimeout(() => {
                            window.location.href = "profile.html";
                        }, 1500);
                    },
                    error: function(xhr) {
                        const errorMsg = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error : "Server error or User not found";
                        alert("Top-up Failed: " + errorMsg);
                        btn.html('Process Top-Up <i class="fa-solid fa-arrow-right ms-2"></i>').prop('disabled', false);
                    }
                });
            });
        });
    </script>
</body>
</html>
