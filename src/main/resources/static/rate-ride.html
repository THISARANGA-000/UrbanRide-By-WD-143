<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Ride | UrbanRide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #F3F4F6;
            min-height: 100vh;
            overflow-y: auto !important;
        }
        .modal-backdrop-custom {
            position: fixed; inset: 0;
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1040;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem 0;
        }
        .star-rating i { font-size: 2.5rem; color: #E5E7EB; cursor: pointer; transition: all 0.2s; margin: 0 0.2rem; }
        .star-rating i.active, .star-rating i:hover { color: #F59E0B; transform: scale(1.1); }
        .tag-btn { background: #F3F4F6; color: #4B5563; border: 1px solid #D1D5DB; transition: all 0.2s; font-size: 0.9rem; }
        .btn-check:checked + .tag-btn { background: #FEF3C7; color: #D97706; border-color: #F59E0B; transform: scale(1.05); }
        .classic-card { 
            max-height: 90vh; 
            overflow-y: auto;
            scrollbar-width: none;
        }
        .classic-card::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="m-0 p-0">

    <div class="modal-backdrop-custom">
        <div class="classic-card shadow-lg border text-center" style="max-width: 500px; width: 90%; padding: 3rem 2rem;">
            
            <div class="position-relative d-inline-block mb-3">
                <div class="rounded-circle bg-white border border-2 border-primary p-1 shadow-sm" style="width: 100px; height: 100px; overflow: hidden;">
                    <img src="https://ui-avatars.com/api/?name=Test+Driver&background=F59E0B&color=fff" class="w-100 h-100 object-fit-cover rounded-circle" alt="Driver">
                </div>
                <div class="position-absolute bottom-0 end-0 bg-success rounded-circle border border-white" style="width: 25px; height: 25px; display:flex; align-items:center; justify-content:center;">
                    <i class="fa-solid fa-check text-white" style="font-size: 12px;"></i>
                </div>
            </div>

            <div class="bg-success bg-opacity-10 text-success p-3 rounded-4 border border-success border-opacity-25 mb-4 shadow-sm animate__animated animate__fadeInDown">
                <i class="fa-solid fa-circle-check fs-4 mb-2 d-block"></i>
                <h5 class="fw-bold mb-1">Payment Successful!</h5>
                <h3 class="fw-bold mb-0" id="finalAmountPaid">LKR 0</h3>
            </div>

            <h2 class="fw-bold mb-1 text-dark">Rate Your Driver</h2>
            <p class="text-muted mb-4 fw-bold">How was your ride today?</p>

            <div class="star-rating mb-4 d-flex justify-content-center" id="starRating">
                <i class="fa-solid fa-star" data-rating="1"></i>
                <i class="fa-solid fa-star" data-rating="2"></i>
                <i class="fa-solid fa-star" data-rating="3"></i>
                <i class="fa-solid fa-star" data-rating="4"></i>
                <i class="fa-solid fa-star" data-rating="5"></i>
            </div>

            <div class="mb-4 d-none" id="compliments" style="animation: fadeIn 0.5s;">
                <p class="small text-muted text-uppercase fw-bold mb-3">What went well?</p>
                <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                    <input type="checkbox" class="btn-check" id="tag1" autocomplete="off"><label class="btn tag-btn rounded-pill px-3" for="tag1"><i class="fa-solid fa-shield-halved me-1"></i> Safe</label>
                    <input type="checkbox" class="btn-check" id="tag2" autocomplete="off"><label class="btn tag-btn rounded-pill px-3" for="tag2"><i class="fa-solid fa-broom me-1"></i> Clean</label>
                    <input type="checkbox" class="btn-check" id="tag3" autocomplete="off"><label class="btn tag-btn rounded-pill px-3" for="tag3"><i class="fa-solid fa-clock me-1"></i> On Time</label>
                    <input type="checkbox" class="btn-check" id="tag4" autocomplete="off"><label class="btn tag-btn rounded-pill px-3" for="tag4"><i class="fa-solid fa-music me-1"></i> Good Music</label>
                </div>
                
                <textarea class="form-control bg-light border-secondary text-dark rounded-3 p-3 shadow-sm" rows="3" placeholder="Leave a comment (optional)"></textarea>
            </div>

            <div class="d-grid gap-3 mt-4">
                <button class="btn btn-primary btn-lg fw-bold shadow-sm py-3 text-dark" id="submitFeedback">Submit Feedback</button>
                <a href="profile.html" class="text-muted text-decoration-none fw-bold hover-effect">Skip for now</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            let selectedRating = 0;
            
            // Get final amount from localStorage
            const finalAmount = localStorage.getItem('last_fare') || "LKR 1,250";
            $('#finalAmountPaid').text(finalAmount);

            $('#starRating i').hover(
                function() { $(this).prevAll().addBack().addClass('active'); },
                function() { if(selectedRating===0) { $('#starRating i').removeClass('active'); } 
                             else { updateStars(selectedRating); } }
            );

            $('#starRating i').click(function() {
                selectedRating = $(this).data('rating');
                updateStars(selectedRating);
                $('#compliments').removeClass('d-none');
            });

            function updateStars(rating) {
                $('#starRating i').removeClass('active');
                $('#starRating i').each(function(index) {
                    if (index < rating) $(this).addClass('active');
                });
            }

            $('#submitFeedback').click(function() {
                if(selectedRating === 0) { alert("Please select a star rating first!"); return; }
                
                const urlParams = new URLSearchParams(window.location.search);
                const driverId = urlParams.get('driverId');

                if (driverId) {
                    $.ajax({
                        url: `/api/drivers/${driverId}/rate`,
                        type: 'PUT',
                        contentType: 'application/json',
                        data: JSON.stringify({ 
                            rating: selectedRating,
                            comment: $('textarea').val() || "No comment",
                            passengerId: (localStorage.getItem('urbanride_userId') || "0").replace(/[^\d]/g, '')
                        }),
                        success: function() {
                            $('#submitFeedback').html('<i class="fa-solid fa-check"></i> Thank You!').removeClass('btn-primary').addClass('btn-success');
                            setTimeout(() => { window.location.href = "profile.html"; }, 1500);
                        },
                        error: function() {
                            alert("Rating failed. Redirecting anyway...");
                            window.location.href = "profile.html";
                        }
                    });
                } else {
                    window.location.href = "profile.html";
                }
            });
        });
    </script>
</body>
</html>
