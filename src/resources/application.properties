server.port=8080
spring.application.name=UrbanRide

# ===== H2 DATABASE (No installation needed) =====
spring.datasource.url=jdbc:h2:file:./urbanridedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=urbanride123

# ===== H2 CONSOLE (open: http://localhost:8080/h2-console) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== CORS (allow all for demo) =====
spring.mvc.cors.allowed-origins=*
